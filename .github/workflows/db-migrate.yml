name: Database Migration

# Temporary one-time production restoration trigger. Revert to manual-only after this run.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply content operations migration when absent
        shell: bash
        run: |
          set -euo pipefail
          table_exists="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 \
            -c "select to_regclass('public.content_operation_items') is not null")"

          if [[ "$table_exists" == "t" ]]; then
            echo "Content operations schema already exists; skipping migration."
          else
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
              -f packages/db/drizzle/0013_small_puma.sql
          fi
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Apply Dashboard-Centric workflow migration idempotently
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -f packages/db/drizzle/0014_content_workflow.sql
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Verify content operations schema
        shell: bash
        run: |
          set -euo pipefail
          table_count="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname in ('content_operation_items', 'content_channel_tasks', 'content_notification_deliveries', 'content_performance_snapshots', 'content_workflow_items') and c.relkind = 'r'")"

          if [[ "$table_count" != "5" ]]; then
            echo "Expected five content operations tables, found $table_count."
            exit 1
          fi

          rls_enabled="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select relrowsecurity and not relforcerowsecurity from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and c.relname = 'content_workflow_items'")"
          direct_grants="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select count(*) from information_schema.role_table_grants where table_schema = 'public' and table_name = 'content_workflow_items' and grantee in ('anon', 'authenticated', 'service_role')")"
          restored_rows="$(psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select count(*) from public.content_workflow_items")"

          if [[ "$rls_enabled" != "t" || "$direct_grants" != "0" || "$restored_rows" -lt "12" ]]; then
            echo "Workflow acceptance failed: rls=$rls_enabled grants=$direct_grants rows=$restored_rows"
            exit 1
          fi

          echo "Verified five content operations tables, RLS boundary, and at least 12 restored workflow rows."
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
